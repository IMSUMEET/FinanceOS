AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FinanceOS API — Hono on AWS Lambda (Node.js 22), health check only. Build backend first (npm run build in ../backend) so dist/lambda.js exists.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Tracing: Active

Resources:
  # HTTP API. CORS: API Gateway does not support https://*.vercel.app; use * so any Vercel preview/production URL can call the API, or add Parameters later for a strict list.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - http://localhost:3000
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 300

  FinanceApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Pre-built bundle from backend/ (see README). Handler file must be dist/lambda.js
      CodeUri: ../backend/dist
      Handler: lambda.handler
      Runtime: nodejs22.x
      Description: Finance OS — GET /health (Hono on Lambda)
      Environment:
        Variables:
          NODE_ENV: production
      Events:
        HealthAndProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            # Single integration; Hono serves /health (and future routes)
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Invoke URL for the $default stage (append paths e.g. /health)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  HealthCheckExample:
    Description: Example curl
    Value: !Sub "curl https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
